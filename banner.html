<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    /* === ОСНОВНОЙ КОНТЕЙНЕР === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center; /* Центрируем карточку строго посередине выделенной зоны */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .scene {
      position: absolute;
      width: 92%;
      max-width: 380px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(0.95);
      display: flex;
      justify-content: center;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* === КАРТОЧКА С ОТСТУПАМИ === */
    .banner-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(25px) saturate(200%);
      -webkit-backdrop-filter: blur(25px) saturate(200%);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      
      /* Отступы: 25px сверху/снизу и 20px по бокам для баланса */
      padding: 25px 20px; 
      
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
      padding: 20px 25px;
    }

    /* === ТИПОГРАФИКА (УМЕНЬШЕННЫЙ РАЗМЕР) === */
    .brand-title {
      color: #000000;
      font-size: 17px; /* Уменьшили с 20px */
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }

    .instruction-text {
      color: #000000;
      font-size: 14px;
      opacity: 0.6;
      margin: 0;
    }

    .product-info { font-size: 14px; color: #000; opacity: 0.6; }
    .url-info { font-size: 11px; color: #000; opacity: 0.4; margin-top: 2px; }

    .buy-button {
      color: #007AFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
    }

    /* === ВОССТАНОВЛЕННАЯ АНИМАЦИЯ DOT === */
    .dots-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #000; /* Черный для контраста */
      border-radius: 50%;
      opacity: 0.3;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }

    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-6px); opacity: 0.6; }
    }

  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="banner-card">
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="brand-title">Find a surface to place the model</div>
      <div class="instruction-text">Pinch to resize</div>
    </div>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card buy-layout">
      <div class="text-content">
        <div class="brand-title" style="margin:0;">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">vitalii-hton.github.io</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">
        Buy Now
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // Переключаем через 8 секунд
      setTimeout(() => {
        const inst = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        inst.style.opacity = '0';
        inst.style.transform = 'scale(0.95)';
        
        setTimeout(() => {
          inst.classList.remove('active');
          buy.classList.add('active');
        }, 500);
      }, 8000);
    });
  </script>

</body>
</html>
