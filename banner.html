<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            color-scheme: only light;
        }

        /* Обнуляем фон и отступы */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent !important;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: flex-end; /* Прижимаем к низу */
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Контейнер для анимации появления */
        #banner-container {
            width: 92%;
            max-width: 400px;
            margin-bottom: calc(env(safe-area-inset-bottom) + 15px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }

        #banner-container.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Стили самой карточки (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.8) !important;
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            backdrop-filter: blur(15px) saturate(180%);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 0.5px solid rgba(255, 255, 255, 0.4);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-size: 12px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            color: #000;
        }

        .price {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        /* Кнопка действия */
        .cta-button {
            background-color: #007AFF !important; /* Нативный синий Apple */
            color: #fff !important;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
        }

        .cta-button:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <div id="banner-container">
        <div class="glass-card">
            <div class="product-info">
                <span class="brand-name">Moon x Hello Kitty</span>
                <span class="product-title">Teeth Whitening</span>
                <span class="price">$39.99</span>
            </div>
            <a href="https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo" 
               class="cta-button" 
               target="_blank">
                Buy
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Задержка 4 секунды: даем пользователю время найти поверхность
            // и даем системному тексту "Find a surface" исчезнуть.
            setTimeout(() => {
                const container = document.getElementById('banner-container');
                container.classList.add('visible');
            }, 4000);
        });
    </script>

</body>
</html>
