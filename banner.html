<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    /* === 1. ГЛОБАЛЬНЫЕ НАСТРОЙКИ === */
    :root {
       color-scheme: only light;
    }

    /* Удалили принудительный background: transparent !important со всех элементов (*), 
       так как это ломает отрисовку кнопок и теней в новых iOS */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%; /* Заменили 100vh на 100% для стабильности */
      background-color: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      /* Смещаем баннер чуть выше, чтобы он не перекрывал системную полоску iOS */
      align-items: flex-end; 
      padding-bottom: env(safe-area-inset-bottom);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      pointer-events: none;
    }

    /* === 2. СТИЛИ СЦЕН === */
    .scene {
      position: absolute;
      width: 92%;
      max-width: 380px;
      opacity: 0;
      transition: all 0.5s ease;
      display: flex;
      justify-content: center;
      bottom: 20px; /* Фиксируем отступ снизу */
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* === 3. ГЕОМЕТРИЯ КАРТОЧКИ === */
    .banner-card {
      width: 100%;
      /* Добавили полупрозрачный фон, чтобы backdrop-filter (размытие) работал */
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
      border: 0.5px solid rgba(255,255,255,0.3) !important;
      border-radius: 18px; /* Немного увеличили скругление под стиль iOS */
      padding: 12px 18px;
      display: flex;
      box-sizing: border-box;
    }

    .instruction-layout {
      flex-direction: column;
      align-items: center; 
    }

    .text-block-down {
      text-align: left;
      width: 100%;
      margin-top: 10px;
    }

    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* === 4. ТЕКСТ === */
    .brand-title {
      color: #000;
      font-size: 16px;
      font-weight: 800;
      margin: 0;
    }

    .instruction-text,
    .product-info {
      color: #000;
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 0;
    }

    .url-info {
      font-size: 10px;
      opacity: 0.6;
      color: #000;
    }

    .buy-button {
      color: #fff !important; /* Белый текст на синем фоне */
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: #007AFF !important; /* Нативный синий Apple */
      padding: 8px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* === 5. АНИМАЦИЯ DOTS (ОСТАВЛЕНА БЕЗ ИЗМЕНЕНИЙ) === */
    .dots-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #000 !important;
      border-radius: 50%;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-4px); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="banner-card instruction-layout">
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="text-block-down">
        <div class="brand-title">Find a surface to place the model</div>
        <div class="instruction-text">Pinch to resize</div>
      </div>
    </div>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card buy-layout">
      <div class="text-content">
        <div class="brand-title">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">moonoralbeauty.com</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">Buy</a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // Увеличили задержку до 8 секунд, так как системные сообщения iOS 26.x 
      // висят чуть дольше при инициализации камеры
      setTimeout(() => {
        const inst = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        inst.style.opacity = '0';

        setTimeout(() => {
          inst.classList.remove('active');
          buy.classList.add('active');
        }, 500);
      }, 8000); 
    });
  </script>

</body>
</html>
