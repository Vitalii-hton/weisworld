<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    /* === ГЛОБАЛЬНЫЕ НАСТРОЙКИ ДЛЯ ПРОЗРАЧНОСТИ === */
    :root {
       color-scheme: light dark; /* Позволяет системе понимать, что мы готовы к любому фону */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Ключевая строка: явный прозрачный цвет фона */
      background-color: rgba(0,0,0,0) !important;
      background: transparent !important; 
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      /* Дополнительный хак для iOS */
      -webkit-text-size-adjust: 100%;
    }

    /* === СТИЛИ СЦЕН === */
    .scene {
      position: absolute;
      width: 90%;
      max-width: 380px;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* === СТЕКЛЯННАЯ КАРТОЧКА === */
    .banner-card {
      background: rgba(255, 255, 255, 0.01); 
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    /* Горизонтальный вид для покупки */
    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
    }

    /* === ТЕКСТ === */
    .brand-title {
      color: #000000;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .instruction-text {
      color: #000000;
      font-size: 14px;
      opacity: 0.6;
      margin: 4px 0 0;
    }

    .product-info { font-size: 14px; opacity: 0.6; color: #000; }
    .url-info { font-size: 12px; opacity: 0.4; color: #000; margin-top: 2px; }

    .buy-button {
      color: #007AFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
    }

    /* === АНИМАЦИЯ DOTS === */
    .dots-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #000;
      border-radius: 50%;
      opacity: 0.3;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }

    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-5px); opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="banner-card">
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="brand-title">Find a surface to place the model</div>
      <div class="instruction-text">Pinch to resize</div>
    </div>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card buy-layout">
      <div class="text-content">
        <div class="brand-title">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">vitalii-hton.github.io</div>
      </div>
      <a href="https://www.moonoralbeauty.com" class="buy-button">
        Buy Now
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const inst = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        inst.style.opacity = '0';
        
        setTimeout(() => {
          inst.classList.remove('active');
          buy.classList.add('active');
        }, 600);
      }, 7000); 
    });
  </script>

</body>
</html>
