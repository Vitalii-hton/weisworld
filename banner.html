<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* === ЦЕНТРИРОВАНИЕ КОНТЕЙНЕРА === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .scene {
      position: absolute;
      width: 90%;
      max-width: 400px; /* Немного увеличили макс. ширину */
      opacity: 0;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translateY(10px);
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* === ОБНОВЛЕННАЯ КАРТОЧКА С БОЛЬШИМИ ОТСТУПАМИ === */
    .banner-card {
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 0.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px; /* Более округлые углы */
      
      /* УВЕЛИЧЕННЫЕ ОТСТУПЫ: 40px сверху/снизу, 30px по бокам */
      padding: 40px 30px; 
      
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      box-sizing: border-box;
    }

    /* Стили для горизонтального расположения (кнопка покупки) */
    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
      align-items: center;
      padding: 30px 25px; /* Чуть меньше для компактности кнопки */
    }

    /* === ТИПОГРАФИКА === */
    .brand-title {
      color: #000000;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
      line-height: 1.2;
    }

    .instruction-text {
      color: #000000;
      font-size: 16px;
      line-height: 1.4;
      opacity: 0.7;
      margin: 0;
    }

    .product-info {
      font-size: 15px;
      opacity: 0.6;
    }

    .url-info {
      font-size: 13px;
      opacity: 0.4;
      margin-top: 4px;
    }

    .buy-button {
      color: #007AFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 19px;
      padding-left: 15px;
    }

    /* Анимация точек */
    .dots-container {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #000; /* Черные точки для лучшей видимости на стекле */
      border-radius: 50%;
      opacity: 0.3;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="banner-card">
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot" style="animation-delay: 0.3s;"></div>
      </div>
      <div class="brand-title">Find a surface to place the model</div>
      <div class="instruction-text">Pinch to resize</div>
    </div>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card buy-layout">
      <div class="text-content">
        <div class="brand-title" style="margin:0;">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">vitalii-hton.github.io</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">
        Buy Now
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // Переключение баннера через 8 секунд
      setTimeout(() => {
        const inst = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        inst.classList.remove('active');
        
        setTimeout(() => {
          buy.classList.add('active');
        }, 600);
      }, 8000);
    });
  </script>

</body>
</html>
