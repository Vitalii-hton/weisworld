<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />

  <style>
    :root {
      color-scheme: only light;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    /* === КОНТЕЙНЕР БАННЕРА === */
    .banner-root {
      position: fixed;
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom);
      display: flex;
      justify-content: center;
      padding-bottom: 20px;
      pointer-events: none;
    }

    /* === СЦЕНЫ === */
    .scene {
      width: 92%;
      max-width: 380px;
      display: none;
      pointer-events: auto;
    }

    .scene.active {
      display: block;
    }

    /* === КАРТОЧКА === */
    .banner-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      border: 0.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      padding: 12px 18px;
      box-sizing: border-box;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      display: flex;
    }

    /* === ЛЕЙАУТЫ === */
    .instruction-layout {
      flex-direction: column;
      align-items: center;
    }

    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    /* === ТЕКСТ === */
    .brand-title {
      color: #000;
      font-size: 16px;
      font-weight: 800;
      margin: 0;
    }

    .instruction-text,
    .product-info {
      color: #000;
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 0;
    }

    .url-info {
      font-size: 10px;
      opacity: 0.6;
      color: #000;
    }

    .text-block-down {
      text-align: left;
      width: 100%;
      margin-top: 10px;
    }

    /* === КНОПКА === */
    .buy-button {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: #007AFF;
      padding: 8px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }

    /* === DOTS === */
    .dots-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    @keyframes jump {
      0%,
      100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-4px);
        opacity: 0.8;
      }
    }
  </style>
</head>

<body>
  <div class="banner-root">
    <!-- INSTRUCTION -->
    <div id="scene-instruction" class="scene active">
      <div class="banner-card instruction-layout">
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="text-block-down">
          <div class="brand-title">Find a surface to place the model</div>
          <div class="instruction-text">Pinch to resize</div>
        </div>
      </div>
    </div>

    <!-- BUY -->
    <div id="scene-buy" class="scene">
      <div class="banner-card buy-layout">
        <div class="text-content">
          <div class="brand-title">Moon</div>
          <div class="product-info">Oral beauty, $39.99</div>
          <div class="url-info">moonoralbeauty.com</div>
        </div>
        <a
          href="https://www.weis.world/ua/campaign"
          class="buy-button"
          >Buy</a
        >
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var inst = document.getElementById("scene-instruction");
        var buy = document.getElementById("scene-buy");

        inst.classList.remove("active");
        buy.classList.add("active");
      }, 8000);
    });
  </script>
</body>
</html>
