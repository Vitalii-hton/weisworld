<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* === БАЗОВЫЕ СТИЛИ === */
    body {
      margin: 0;
      padding: 0;
      background: transparent; /* Для AR лучше оставить прозрачным или черным */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end; /* Смещаем вниз, как на фото */
      padding-bottom: 30px;
      overflow: hidden;
    }

    /* === КОНТЕЙНЕРЫ ДЛЯ СЦЕН === */
    .scene {
      position: absolute;
      width: 92%; /* Ширина как у системного уведомления */
      max-width: 400px;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .scene.hidden {
      opacity: 0;
      transform: translateY(-20px);
    }

    /* === СЦЕНА 1: ИНСТРУКЦИЯ (в темном стиле, как была) === */
    #scene-instruction {
      text-align: center;
      bottom: 50%;
      color: white;
    }

    .gesture-container {
      position: relative;
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
    }
    
    .finger {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
    }

    .finger-left { animation: pinch-left 1.5s infinite ease-in-out; }
    .finger-right { animation: pinch-right 1.5s infinite ease-in-out; }

    @keyframes pinch-left {
      0% { transform: translate(-5px, 5px); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: translate(-20px, 20px); opacity: 0; }
    }
    @keyframes pinch-right {
      0% { transform: translate(5px, -5px); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: translate(20px, -20px); opacity: 0; }
    }

    /* === СЦЕНА 2: ПОКУПКА (НОВЫЙ ВИД ПОД ФОТО) === */
    .banner-card {
      background: rgba(235, 235, 235, 0.95); /* Светло-серый фон */
      backdrop-filter: blur(10px); /* Эффект матового стекла */
      -webkit-backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .text-content {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      color: #000000;
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }

    .product-info {
      color: #86868b; /* Серый цвет Apple */
      font-size: 14px;
      font-weight: 400;
      margin: 0;
    }

    .url-info {
      color: #86868b;
      font-size: 14px;
      opacity: 0.8;
    }

    .buy-button {
      color: #007AFF; /* Фирменный синий Apple */
      text-decoration: none;
      font-weight: 600;
      font-size: 19px;
      padding-left: 15px;
      transition: opacity 0.2s;
    }

    .buy-button:active {
      opacity: 0.5;
    }

  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="gesture-container">
      <div class="finger finger-left"></div>
      <div class="finger finger-right"></div>
    </div>
    <h2 style="margin:0; font-size:18px;">Scale & Move</h2>
    <p style="margin:5px 0 0; opacity:0.7; font-size:14px;">Pinch to resize object</p>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card">
      <div class="text-content">
        <div class="brand-title">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">vitalii-hton.github.io</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">
        Buy Now
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // Через 10 секунд меняем сцену
      setTimeout(() => {
        const instruction = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        instruction.classList.remove('active');
        instruction.classList.add('hidden');

        setTimeout(() => {
          buy.classList.add('active');
        }, 400); 

      }, 10000);
    });
  </script>

</body>
</html>
