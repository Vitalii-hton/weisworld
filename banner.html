<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root {
      color-scheme: only light;
    }

    /* === ГЛОБАЛЬНАЯ ЗАЛИВКА === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Убираем ограничения формы: теперь фон на весь экран фрейма */
      background: rgba(255, 255, 255, 0.75) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === КОНТЕЙНЕР БАННЕРА === */
    .banner-root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    /* === СЦЕНЫ === */
    .scene {
      width: 100%;
      padding: 0 20px; /* Отступы от краев экрана */
      box-sizing: border-box;
      display: none;
      pointer-events: auto;
    }

    .scene.active {
      display: block;
      /* Плавное проявление контента */
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === КАРТОЧКА (БЕЗ ГРАНИЦ) === */
    .banner-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .instruction-layout {
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    /* === ТЕКСТ === */
    .brand-title {
      color: #000;
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .instruction-text, .product-info {
      color: #000;
      font-size: 14px;
      font-weight: 500;
      margin: 2px 0 0;
      opacity: 0.9;
    }

    .url-info {
      font-size: 11px;
      opacity: 0.5;
      color: #000;
      font-weight: 400;
    }

    .text-content {
      display: flex;
      flex-direction: column;
    }

    /* === КНОПКА === */
    .action-button {
      color: #fff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      background: #007AFF !important;
      padding: 10px 22px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
      white-space: nowrap;
      -webkit-appearance: none;
      border: none;
    }

    /* === DOTS === */
    .dots-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }

    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-4px); opacity: 0.6; }
    }
  </style>
</head>

<body>
  <div class="banner-root">
    <div id="scene-instruction" class="scene active">
      <div class="banner-content instruction-layout">
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="brand-title">Find a surface to place the model</div>
        <div class="instruction-text">Pinch to resize</div>
      </div>
    </div>

    <div id="scene-buy" class="scene">
      <div class="banner-content">
        <div class="text-content">
          <div class="brand-title">Moon</div>
          <div class="product-info">Oral beauty, $39.99</div>
          <div class="url-info">moonoralbeauty.com</div>
        </div>
        <a href="https://www.weis.world/ua/campaign" class="action-button">Open</a>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var inst = document.getElementById("scene-instruction");
        var buy = document.getElementById("scene-buy");
        if(inst && buy) {
          inst.classList.remove("active");
          buy.classList.add("active");
        }
      }, 7000); // 7 секунд на поиск поверхности
    });
  </script>
</body>
</html>
