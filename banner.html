<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <style>
    /* === 1. УЛЬТРА-СБРОС ФОНА === */
    :root {
       color-scheme: only light; /* Запрещаем системе переключать темы */
    }

    * {
      background-color: transparent !important;
      background: transparent !important;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      pointer-events: none; /* Тело страницы не ловит клики */
    }

    /* === 2. СТИЛИ СЦЕН === */
    .scene {
      position: absolute;
      width: 90%;
      max-width: 380px;
      opacity: 0;
      transition: all 0.5s ease;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto; /* Только активная сцена ловит клики */
    }

    /* === 3. КАРТОЧКА БЕЗ СИСТЕМНОГО ФОНА === */
    .banner-card {
      /* ВАЖНО: Мы убираем backdrop-filter и background полностью */
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      
      /* Добавляем очень слабую тень только тексту, чтобы он не терялся */
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      
      border: none !important;
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
    }

    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
      width: 100%;
    }

    /* === 4. ТЕКСТ (С ТЕНЬЮ ДЛЯ ЧИТАЕМОСТИ) === */
    .brand-title {
      color: #000000;
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.8); /* Белое свечение вокруг букв */
    }

    .instruction-text, .product-info {
      color: #000000;
      font-size: 14px;
      font-weight: 500;
      margin: 4px 0 0;
    }

    .url-info {
      font-size: 11px;
      opacity: 0.5;
      color: #000;
    }

    .buy-button {
      color: #007AFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 19px;
      background: white !important; /* Кнопку оставим видимой */
      padding: 8px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* === АНИМАЦИЯ === */
    .dots-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px; height: 10px;
      background: #000;
      border-radius: 50%;
      animation: jump 1.4s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-6px); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="banner-card">
      <div class="dots-container">
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="brand-title">Find a surface to place the model</div>
      <div class="instruction-text">Pinch to resize</div>
    </div>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card buy-layout">
      <div class="text-content">
        <div class="brand-title">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">moonoralbeauty.com</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">Buy</a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const inst = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');
        inst.style.opacity = '0';
        setTimeout(() => {
          inst.classList.remove('active');
          buy.classList.add('active');
        }, 500);
      }, 7000); 
    });
  </script>

</body>
</html>
