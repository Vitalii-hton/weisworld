<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root {
      color-scheme: only light;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* Изменено на 100%, чтобы контент центрировался во фрейме баннера */
      height: 100%; 
      background-color: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      /* Центрируем содержимое баннера по вертикали и горизонтали */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === КОНТЕЙНЕР БАННЕРА === */
    .banner-root {
      width: 92%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      /* Убрали position: fixed, так как фрейм баннера сам по себе ограничен */
    }

    /* === СЦЕНЫ === */
    .scene {
      width: 100%;
      display: none;
      pointer-events: auto;
    }

    .scene.active {
      display: block;
    }

    /* === КАРТОЧКА === */
    .banner-card {
      width: 100%;
      /* Добавили backdrop-filter для "стеклянного" эффекта */
      background: rgba(255, 255, 255, 0.8) !important;
      -webkit-backdrop-filter: blur(15px);
      backdrop-filter: blur(15px);
      border: 0.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      padding: 12px 18px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
    }

    .instruction-layout {
      flex-direction: column;
      align-items: center;
    }

    .buy-layout {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    /* === ТЕКСТ === */
    .brand-title {
      color: #000;
      font-size: 16px;
      font-weight: 800;
      margin: 0;
    }

    .instruction-text, .product-info {
      color: #000;
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 0;
    }

    .url-info {
      font-size: 10px;
      opacity: 0.6;
      color: #000;
    }

    .text-block-down {
      text-align: left;
      width: 100%;
      margin-top: 10px;
    }

    /* === КНОПКА (ЗАЩИТА ОТ APPLE PAY) === */
    .action-trigger {
      color: #fff !important;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: #007AFF !important;
      padding: 8px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      /* Убираем стандартные стили кнопок, которые ищет iOS */
      -webkit-appearance: none;
    }

    /* === DOTS === */
    .dots-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      animation: jump 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }

    @keyframes jump {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-4px); opacity: 0.8; }
    }
  </style>
</head>

<body>
  <div class="banner-root">
    <div id="scene-instruction" class="scene active">
      <div class="banner-card instruction-layout">
        <div class="dots-container">
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="text-block-down">
          <div class="brand-title">Find a surface to place the model</div>
          <div class="instruction-text">Pinch to resize</div>
        </div>
      </div>
    </div>

    <div id="scene-buy" class="scene">
      <div class="banner-card buy-layout">
        <div class="text-content">
          <div class="brand-title">Moon</div>
          <div class="product-info">Oral beauty, $39.99</div>
          <div class="url-info">moonoralbeauty.com</div>
        </div>
        <a href="https://www.weis.world/ua/campaign" class="action-trigger">Shop</a>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        var inst = document.getElementById("scene-instruction");
        var buy = document.getElementById("scene-buy");
        if(inst && buy) {
          inst.classList.remove("active");
          buy.classList.add("active");
        }
      }, 8000);
    });
  </script>
</body>
</html>
