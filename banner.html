<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* === ИСПРАВЛЕНИЕ ЦЕНТРИРОВАНИЯ И ПОДЛОЖКИ === */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important; /* Убираем белую подложку */
      overflow: hidden;
      display: flex;
      justify-content: center; /* Центр по горизонтали */
      align-items: center;     /* Центр по вертикали */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    /* === КОНТЕЙНЕРЫ ДЛЯ СЦЕН === */
    .scene {
      position: absolute;
      width: 90%;
      max-width: 380px;
      opacity: 0;
      transform: scale(0.95); /* Мягкое появление */
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* === СЦЕНА 1: ИНСТРУКЦИЯ === */
    #scene-instruction {
      text-align: center;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .gesture-container {
      position: relative;
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
    }
    
    .finger {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .finger-left { animation: pinch-left 1.5s infinite ease-in-out; }
    .finger-right { animation: pinch-right 1.5s infinite ease-in-out; }

    @keyframes pinch-left {
      0% { transform: translate(-5px, 5px); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: translate(-25px, 25px); opacity: 0; }
    }
    @keyframes pinch-right {
      0% { transform: translate(5px, -5px); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: translate(25px, -25px); opacity: 0; }
    }

    /* === СЦЕНА 2: БАННЕР (КАК НА ВТОРОМ ФОТО) === */
    .banner-card {
      background: rgba(242, 242, 247, 0.85); /* Светлый полупрозрачный фон Apple */
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .text-content {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title {
      color: #000000;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .product-info {
      color: #6c6c70;
      font-size: 14px;
      font-weight: 400;
    }

    .url-info {
      color: #8e8e93;
      font-size: 13px;
    }

    .buy-button {
      color: #007AFF; /* Фирменный синий цвет */
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
      padding-left: 10px;
    }

    .buy-button:active {
      opacity: 0.3;
    }

  </style>
</head>
<body>

  <div id="scene-instruction" class="scene active">
    <div class="gesture-container">
      <div class="finger finger-left"></div>
      <div class="finger finger-right"></div>
    </div>
    <h2 style="margin:0; font-size:18px;">Scale & Move</h2>
    <p style="margin:4px 0 0; opacity:0.8; font-size:14px;">Pinch to resize object</p>
  </div>

  <div id="scene-buy" class="scene">
    <div class="banner-card">
      <div class="text-content">
        <div class="brand-title">Moon</div>
        <div class="product-info">Oral beauty, $39.99</div>
        <div class="url-info">vitalii-hton.github.io</div>
      </div>
      <a href="https://www.weis.world/ua/campaign" class="buy-button">
        Buy Now
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      // Смена сцены через 7 секунд
      setTimeout(() => {
        const instruction = document.getElementById('scene-instruction');
        const buy = document.getElementById('scene-buy');

        instruction.classList.remove('active');

        setTimeout(() => {
          buy.classList.add('active');
        }, 500); 

      }, 7000);
    });
  </script>

</body>
</html>
