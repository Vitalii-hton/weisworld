<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Quick Look — MOON</title>
  
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { text-align: center; padding: 20px; font-family: sans-serif; background-color: #fff; margin: 0; }
    .ar-button {
      background-color: #e40b29; color: white; padding: 14px 28px; border: none;
      border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px;
      display: none; font-weight: bold; text-transform: uppercase;
    }
    .ar-button:hover { background-color: #b30920; }
    model-viewer {
      width: 100%; max-width: 600px; height: 500px;
      border-radius: 12px; background: #f0f0f0; margin: 20px auto; display: block;
    }
  </style>
</head>
<body>

  <h1>MOON x Hello Kitty</h1>
  <p>Oral beauty:</p>

  <div id="button-container">
    <button id="ios-button" class="ar-button">📱 Open AR (iOS)</button>
    <button id="android-button" class="ar-button">📱 Open AR (Android)</button>
    <button id="open-browser" class="ar-button">🌐 Open in Safari/Chrome</button>
  </div>

  <model-viewer
    id="ar-viewer"
    src="https://vitalii-hton.github.io/weisworld/glbanimations26.glb"
    ios-src="https://vitalii-hton.github.io/weisworld1/try37.usdz#custom=https://vitalii-hton.github.io/weisworld/banner.html&customHeight=small"
    alt="MOON x Hello Kitty 3D Model"
    camera-controls
    auto-rotate
    autoplay
    ar
    ar-modes="scene-viewer quick-look webxr" 
    link="https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo"
    title="Moon x Hello Kitty">
  </model-viewer>

  <script>
    const arViewer = document.getElementById('ar-viewer');
    const iosBtn = document.getElementById('ios-button');
    const androidBtn = document.getElementById('android-button');
    const openBtn = document.getElementById('open-browser');

    const productUrl = "https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo";
    const glbUrl = "https://vitalii-hton.github.io/weisworld/glbanimations26.glb";
    
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isInstagram = /Instagram|FBAN|FBAV|FBSV|FB_IAB/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);

    // 1. Показ кнопок
    if (isInstagram) {
      openBtn.style.display = 'inline-block';
    } else if (isAndroid) {
      androidBtn.style.display = 'inline-block';
    } else {
      iosBtn.style.display = 'inline-block';
    }

    // 2. Обработчик для iOS
    iosBtn.addEventListener('click', () => {
      arViewer.activateAR();
    });

    // 3. Обработчик для Android (Принудительный запуск через Intent)
    androidBtn.addEventListener('click', () => {
      // Пытаемся запустить через стандартный метод
      arViewer.activateAR();
      
      // Запасной вариант: если через 500мс ничего не произошло, пробуем прямой Intent
      setTimeout(() => {
        const intent = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&link=${encodeURIComponent(productUrl)}&title=Moon%20x%20Hello%20Kitty#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://developers.google.com/ar;end;`;
        window.location.href = intent;
      }, 500);
    });

    // Событие для баннера iOS
    arViewer.addEventListener('quick-look-button-tapped', () => {
      window.open(productUrl, '_blank');
    });

    // 4. Логика для In-App (Instagram)
    openBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const currentUrl = window.location.href.replace(/^https?:\/\//i, '');
      if (isIOS) {
        window.location.href = 'x-safari-https://' + currentUrl;
      } else {
        window.location.href = 'intent://' + currentUrl + '#Intent;scheme=https;package=com.android.chrome;end';
      }
    });
  </script>
</body>
</html>
