<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Quick Look — MOON</title>
  
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      text-align: center;
      padding: 20px;
      font-family: sans-serif;
      background-color: #fff;
      margin: 0;
    }

    /* Стили для кнопок */
    .ar-button {
      background-color: #e40b29;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
      display: none; /* Скрыты по умолчанию, включаются через JS */
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.3s;
    }

    .ar-button:hover {
      background-color: #b30920;
    }

    /* Оформление окна предпросмотра */
    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 500px;
      border-radius: 12px;
      background: #f0f0f0;
      margin: 20px auto;
      display: block;
    }

    #button-container {
      min-height: 60px;
    }
  </style>
</head>
<body>

  <h1>MOON x Hello Kitty</h1>
  <p>Oral beauty:</p>

  <div id="button-container">
    <button id="ios-button" class="ar-button">📱 Open AR (iOS)</button>
    <button id="android-button" class="ar-button">📱 Open AR (Android)</button>
    <button id="open-browser" class="ar-button">🌐 Open in Safari/Chrome</button>
  </div>

  <model-viewer
    id="ar-viewer"
    src="https://vitalii-hton.github.io/weisworld/glbanimations26.glb"
    ios-src="https://vitalii-hton.github.io/weisworld1/try37.usdz#custom=https://vitalii-hton.github.io/weisworld/banner.html&customHeight=small"
    alt="MOON x Hello Kitty 3D Model"
    camera-controls
    auto-rotate
    autoplay
    ar
    ar-modes="quick-look scene-viewer webxr"
    link="https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo"
    title="Moon x Hello Kitty">
  </model-viewer>

  <script>
    const arViewer = document.getElementById('ar-viewer');
    const iosBtn = document.getElementById('ios-button');
    const androidBtn = document.getElementById('android-button');
    const openBtn = document.getElementById('open-browser');

    const productUrl = "https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo";
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    // Определяем среду
    const isInstagram = /Instagram|FBAN|FBAV|FBSV|FB_IAB/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);

    // --- 1. ЛОГИКА ОТОБРАЖЕНИЯ КНОПОК ---
    if (isInstagram) {
      openBtn.style.display = 'inline-block';
    } else if (isAndroid) {
      androidBtn.style.display = 'inline-block';
    } else if (isIOS) {
      iosBtn.style.display = 'inline-block';
    } else {
      // Для десктопа показываем общую кнопку
      iosBtn.innerText = "Open AR";
      iosBtn.style.display = 'inline-block';
    }

    // --- 2. ОБРАБОТЧИКИ НАЖАТИЙ ---

    // Универсальная функция запуска (теперь безопасная для Android)
    const activateAR = () => {
      arViewer.activateAR();
    };

    iosBtn.addEventListener('click', activateAR);
    androidBtn.addEventListener('click', activateAR);

    // Специальное событие для баннера в iOS Quick Look
    arViewer.addEventListener('quick-look-button-tapped', () => {
      window.open(productUrl, '_blank');
    });

    // --- 3. БЕЗОПАСНЫЙ АВТОЗАПУСК ---
    // Выполняется только если модель загрузилась и это не Instagram
    window.addEventListener("load", () => {
      if (!isInstagram) {
        arViewer.addEventListener('load', () => {
          setTimeout(() => {
            // На некоторых Android устройствах автозапуск все еще может блокироваться 
            // политикой браузера, но это уже не вызовет вылет страницы.
            arViewer.activateAR();
          }, 1500);
        }, { once: true });
      }
    });

    // --- 4. ВЫХОД ИЗ INSTAGRAM (In-App Browser) ---
    function tryOpen(urlToOpen) {
      const a = document.createElement('a');
      a.href = urlToOpen;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); }, 2000);
    }

    openBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const currentUrl = window.location.href.replace(/^https?:\/\//i, '');
      
      if (isIOS) {
        tryOpen('x-safari-https://' + currentUrl);
      } else {
        // Правильный Intent для открытия Chrome на Android
        tryOpen('intent://' + currentUrl + '#Intent;scheme=https;package=com.android.chrome;end');
      }

      setTimeout(() => {
        if (confirm('Если сайт не открылся в браузере — показать инструкцию?')) {
          window.location.href = '/open-in-safari-instructions.html';
        }
      }, 2500);
    });
  </script>
</body>
</html>
