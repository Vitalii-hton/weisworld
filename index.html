<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Quick Look — MOON</title>
  
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* Стили для кнопок: размеры, цвета и анимация наведения */
    .ar-button {
      background-color: #e40b29;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      display: none; /* По умолчанию скрываем кнопки, чтобы показать только нужную через JS */
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .ar-button:hover {
      background-color: #b30920;
    }

    /* Оформление окна предпросмотра 3D модели */
    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 500px;
      border-radius: 12px;
      background: #f0f0f0;
      margin: 20px auto;
      display: block;
    }
  </style>
</head>
<body style="text-align:center; padding:20px; font-family:sans-serif; background-color: #fff;">

  <h1>MOON x Hello Kitty</h1>
  <p>Oral beauty:</p>

  <div id="button-container">
    <button id="ios-button" class="ar-button">📱 Open AR (iOS)</button>
    
    <button id="android-button" class="ar-button">📱 Open AR (Android)</button>
    
    <button id="open-browser" class="ar-button">🌐 Open in Safari/Chrome</button>
  </div>

  <model-viewer
    id="ar-viewer"
    src="https://vitalii-hton.github.io/weisworld/glbanimations18.glb"
   ios-src="https://vitalii-hton.github.io/weisworld1/try37.usdz#custom=https://vitalii-hton.github.io/weisworld/banner.html&customHeight=small"
    alt="MOON x Hello Kitty 3D Model"
    camera-controls
    auto-rotate
    ar
    ar-modes="quick-look scene-viewer webxr"
    style="width:100%; height:500px;">
  </model-viewer>

  <script>
    // Поиск элементов на странице для дальнейшей работы с ними
    const arViewer = document.getElementById('ar-viewer');
    const iosBtn = document.getElementById('ios-button');
    const androidBtn = document.getElementById('android-button');
    const openBtn = document.getElementById('open-browser');

    // Ссылка на товар, которая будет открываться при клике внутри AR
    const productUrl = "https://moonoralbeauty.com/products/moon-x-hello-kitty%C2%AE-teeth-whitening-pen-duo";
    
    // Получение информации о браузере и устройстве пользователя (User Agent)
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    // Функции-флаги для определения среды: Instagram, iOS или Android
    const isInstagram = /Instagram|FBAN|FBAV|FBSV|FB_IAB/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);

    // ===============================
    // 1. ЛОГИКА ОТОБРАЖЕНИЯ: Проверяем устройство и показываем подходящую кнопку
    // ===============================
    if (isInstagram) {
      // Если открыто в Instagram — приоритет на кнопку выхода в браузер
      openBtn.style.display = 'inline-block';
    } else if (isIOS) {
      // Если обычный браузер на iOS — показываем кнопку для Apple Quick Look
      iosBtn.style.display = 'inline-block';
    } else if (isAndroid) {
      // Если обычный браузер на Android — показываем кнопку для Google Scene Viewer
      androidBtn.style.display = 'inline-block';
    } else {
      // Для всех остальных (десктоп и т.д.) просто даем общую кнопку запуска
      iosBtn.innerText = "Open AR";
      iosBtn.style.display = 'inline-block';
    }

    // ===============================
    // 2. ОБРАБОТЧИКИ НАЖАТИЙ: Что происходит при клике на кнопки
    // ===============================

    // Запуск AR для iPhone: просто вызывает системное окно Quick Look
    iosBtn.addEventListener('click', () => {
      arViewer.activateAR();
    });

    // Запуск AR для Android: формирует сложную ссылку с метаданными
    androidBtn.addEventListener('click', () => {
      const baseSrc = "https://vitalii-hton.github.io/weisworld/glbanimations18.glb";
      
      // Склеиваем путь к модели с параметрами: включаем кнопку (always-show) и передаем ссылку на товар (link)
      const sceneViewerUrl = baseSrc + "#intent-action-always-show=1&link=" + encodeURIComponent(productUrl) + "&title=Moon%20x%20Hello%20Kitty";
      
      // Обновляем источник модели в компоненте
      arViewer.src = sceneViewerUrl;
      
      // Небольшая пауза для обновления данных в памяти браузера перед запуском AR
      setTimeout(() => {
        arViewer.activateAR();
      }, 50);
    });

    // Специальное событие для iOS: отслеживает нажатие на кнопку "баннер" внутри режима дополненной реальности
    arViewer.addEventListener('quick-look-button-tapped', () => {
      window.open(productUrl, '_blank');
    });

    // ===============================
    // 3. АВТОЗАПУСК: Попытка запустить AR автоматически через 1.5 секунды после загрузки
    // ===============================
    window.addEventListener("load", () => {
      // Не запускаем авто-AR внутри Instagram, так как это часто блокируется системой
      if (!isInstagram) { 
        setTimeout(() => {
          if (isAndroid) {
            androidBtn.click(); // На Android запускаем через клик, чтобы применились параметры ссылки
          } else {
            arViewer.activateAR(); // На iOS просто активируем
          }
        }, 1500);
      }
    });

    // ===============================
    // 4. ВЫХОД ИЗ СОЦСЕТЕЙ: Логика открытия страницы во внешнем браузере
    // ===============================
    
    // Вспомогательная функция для создания невидимой ссылки и имитации клика по ней
    function tryOpen(urlToOpen) {
      const a = document.createElement('a');
      a.href = urlToOpen;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); }, 2000);
    }

    // Обработчик кнопки "Open in Safari/Chrome"
    openBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const currentUrl = window.location.href;
      
      // Схемы для принудительного открытия в системных браузерах
      const xSafari = 'x-safari-https://' + currentUrl.replace(/^https?:\/\//i, '');
      const intentUrl = 'intent://' + currentUrl.replace(/^https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';

      if (isIOS) {
        tryOpen(xSafari); // Пытаемся вызвать Safari через протокол x-safari
      } else {
        tryOpen(intentUrl); // Пытаемся вызвать Chrome через Android Intent
      }

      // Если через 1.6 сек пользователь всё еще здесь — предлагаем инструкцию
      setTimeout(() => {
        if (confirm('Если сайт всё ещё открыт в приложении — открыть инструкцию?')) {
          window.location.href = '/open-in-safari-instructions.html';
        }
      }, 1600);
    });
  </script>
</body>
</html>
